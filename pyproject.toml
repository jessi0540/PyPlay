[tool.poetry]
name = "parabank-testing"
version = "0.1.0"
description = "Automatización de pruebas en Parabank con Playwright y POM"
authors = ["Jessica Esquivel <jessica@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
playwright = "*"
pytest = "*"
pytest-playwright = "*"
pytest-html = "*"
pytest-asyncio = "*"

[tool.poetry.group.dev.dependencies]
black = "*"
flake8 = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
